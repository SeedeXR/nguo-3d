[package]
name = "nguo-doc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The authoritative, serializable nguo-3d document: pieces, seams, parameters, materials, avatar."

[dependencies]
# Deflate + CRC-32 for the `.nguo` zip (src/zip.rs). NOT a new crate in the
# tree: `png` -> `tiny-skia`/`vello` -> `iced` -> `nguo-app` already pulls
# flate2 1.x, so the dependency graph, the licence allow-list and the generated
# attribution are all unchanged. Declared here rather than in
# `[workspace.dependencies]` because nguo-doc is its only direct user; hoist it
# the day a second crate wants it.
flate2 = "1"
kurbo = { workspace = true, features = ["serde"] }
nguo-measure = { workspace = true }
nguo-pattern = { workspace = true }
serde = { workspace = true }
# `float_roundtrip`: without it serde_json's fast float parser can be off by
# one ULP, so a saved project does not reload to the same geometry. Caught by
# `nguo-doc-commands`' round-trip property test. Features are additive, so
# enabling it here turns it on for the whole build.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1"
