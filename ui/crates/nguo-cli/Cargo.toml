# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name = "nguo-cli"
description = "Headless, scriptable driver (`nguo`) for the nguo-3d cloth suite"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "nguo_cli"
path = "src/lib.rs"

[[bin]]
name = "nguo"
path = "src/main.rs"

[dependencies]
nguo-engine-bridge = { workspace = true }
# `garment_fit`: the drop-and-fit path. `engine-io` declares the import unit,
# `engine-api` carries resize/resolve_penetration/Scene, `nguo-avatar` is where
# the body's measured girths live. No new third-party dependency — all three are
# already in this tree and `nguo-avatar` already pulls the other two.
nguo-avatar = { workspace = true }
engine-api = { workspace = true }
engine-io = { workspace = true }
# `dress_example`: the whole 2D -> 3D chain in one operation. `nguo-doc` is the
# document and the `.nguo` bundle, `nguo-sewing` is validate/triangulate/arrange/
# sew (and pulls `nguo-triangulate`, which owns the one mm -> m conversion).
# Both are already in this workspace; no new third-party dependency.
nguo-doc = { workspace = true }
nguo-sewing = { workspace = true }
nguo-triangulate = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
