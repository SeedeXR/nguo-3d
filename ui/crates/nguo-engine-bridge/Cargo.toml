# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name = "nguo-engine-bridge"
description = "Async bridge from the nguo-3d app to the ppf-mguso cloth solver"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Not in [workspace.dependencies] (that table is renderer-focused); the bridge
# is the only crate that needs an async runtime today.
tokio = { version = "1", features = ["rt", "sync", "macros"] }
tempfile = "3"
# The in-process transport (`inproc.rs`). Legal only because both lockfiles now
# resolve wgpu 27.0.1 — see the crate docs. `engine-api` is what carries `Scene`
# and `engine-core` what carries `Stitch` and the CPU linear solver.
engine-api = { workspace = true }
engine-core = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
